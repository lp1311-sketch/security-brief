name: autoblog

# Runs twice a day (UTC). GitHub may delay scheduled runs under load.
on:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoblog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds and build site
        run: python3 build.py
      - name: Commit updated site and data
        run: |
          git config user.name "autoblog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "chore: autoblog update $(date -u +%FT%TZ)"
          git push
