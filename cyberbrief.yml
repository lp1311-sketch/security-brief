name: CyberBrief scheduled run
# Inactive until this repo is on GitHub with Actions enabled. Free for public repos.
# GitHub can delay or skip scheduled runs under load; times are UTC.
on:
  schedule:
    - cron: "0 6 * * *"   # morning
    - cron: "0 18 * * *"  # evening
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/run-pipeline.ts
      - name: Commit drafts and run log
        run: |
          git config user.name "cyberbrief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "chore: scheduled run $(date -u +%FT%TZ)"
          git push
