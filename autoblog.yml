name: autoblog

# Checks feeds every 20 minutes (UTC minutes 07, 27, 47). The small status.json
# is committed each run so the published site can show a fresh check timestamp.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoblog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        run: python3 -m unittest -v test_autoblog.py
      - name: Fetch feeds and build site
        run: python3 build.py
      - name: Commit refreshed status and changed content
        run: |
          git config user.name "autoblog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "chore: feed check $(date -u +%FT%TZ)"
          git push
